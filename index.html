<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
        <style>
            .fs-1, .title{
                font-family: 'Pacifico', cursive;
            }
            .contain{
                box-shadow: 8px 8px 32px blue;
            }
            img{
                border-radius: 50%;
            }
            input::placeholder{
                color: rgba(66, 112, 66, 0.8) !important;
            }
        </style>
    </head>
    <body class="bg-dark mx-5 mt-5 p-5">
        <div class="bg-primary contain rounded-4 d-flex flex-column align-items-center p-4">
            <p class="text-success fs-1 fw-bold">WELCOME BACK!!!</p>
            <img src="logo.png" class="m-3" height="160" width="160" alt="">
            <p class="title fs-3 fw-bold text-success">Please enter your details to Login</p>
            <form>
                <input type="text" name="username" id="" placeholder="username" class="form-control border-0 text-success bg-dark">
                <input type="password" name="password" id="" placeholder="password" class="form-control my-3 text-success border-0 bg-dark">
                <button type="submit" class="btn btn-success">Login</button>
                <a href="/sign" class="text-success fs-5">Don't have an account?? SignUp</a>
            </form>
        </div>

        <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
